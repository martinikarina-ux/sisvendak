<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>CinePython - Login</title>
</head>

<body>
    <div class="container">
        <h1>🎬 CinePython</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p style="color: #ff4d4d;">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div id="login-form">
            <h2>Login</h2>
            <form action="/login" method="post">
                <input type="text" name="login" placeholder="Usuário" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p>Não tem conta? <a href="#" onclick="toggleForm()">Cadastre-se</a></p>
        </div>

        <div id="register-form" style="display: none;">
            <h2>Cadastro</h2>
            <form action="/cadastrar" method="post">
                <input type="text" name="nome" placeholder="Nome Completo" required>
                <input type="text" name="login" placeholder="Escolha um Usuário" required>
                <input type="password" name="senha" placeholder="Escolha uma Senha" required>
                <button type="submit" class="btn" style="background: #27ae60;">Criar Conta</button>
            </form>
            <p>Já tem conta? <a href="#" onclick="toggleForm()">Faça Login</a></p>
        </div>
    </div>

    <script>
        function toggleForm() {
            const login = document.getElementById('login-form');
            const reg = document.getElementById('register-form');
            login.style.display = login.style.display === 'none' ? 'block' : 'none';
            reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>

</html>
